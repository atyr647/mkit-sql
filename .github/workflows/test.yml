name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcl8.6-dev cmake g++ python3 xvfb tk8.6
      - name: Lint (ASCII, no shadowed commands, no Tcl 8.6-only commands)
        run: tclsh8.6 tests/lint.tcl
      - name: Engine tests (pure-Tcl Mk4tcl stand-in)
        run: tclsh8.6 tests/run.tcl
      - name: Package loads with package require
        run: tclsh8.6 tests/pkg_check.tcl
      - name: Differential tests against SQLite
        run: |
          for seed in 1 2 3; do python3 tests/differential/diff.py --n 3000 --seed $seed; done
          for seed in 4 5; do python3 tests/differential/diff.py --kind window --n 1500 --seed $seed; done
          python3 tests/differential/diff.py --file tests/differential/recursive.sql
          python3 tests/differential/diff.py --file tests/differential/anyall.sql || true   # SQLite has no ANY/ALL
      - name: Build the real Metakit + Mk4tcl
        run: tests/build_mk4tcl.sh "$RUNNER_TEMP/mk4build"
      - name: Engine tests and Metakit-specific tests (real Metakit)
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/mk4build/build/src"
          export MKIT_MK4TCL="$RUNNER_TEMP/mk4build/build/tcl/libMk4tcl.so"
          tclsh8.6 tests/run.tcl
          tclsh8.6 tests/real_metakit.tcl
          python3 tests/differential/diff.py --n 2000 --seed 9
      - name: Fetch tclkit runtimes (SHA1-verified)
        run: tests/fetch-tclkit.sh
      - name: Engine tests on a real tclkit, Tcl 8.6
        run: MKIT_MK4TCL=builtin tclkit/tclkit-8.6.3 tests/run.tcl
      - name: Engine tests on a real tclkit, Tcl 8.5
        run: MKIT_MK4TCL=builtin tclkit/tclkit-8.5.17 tests/run.tcl
      - name: Metakit-specific tests on tclkit 8.5
        run: MKIT_MK4TCL=builtin tclkit/tclkit-8.5.17 tests/real_metakit.tcl

  # Needs the mkstudio repository; kept separate so the engine job never depends on it.
  mkstudio:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atyr647/mkstudio
          ref: ${{ vars.MKSTUDIO_REF || 'main' }}
          path: mkstudio
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tk8.6 xvfb
      - name: mkstudio's own engine contract
        run: MKSTUDIO_DIR=$PWD/mkstudio tclsh8.6 tests/studio_contract.tcl
      - name: The real MK Studio UI with mkit-sql behind it
        run: MKSTUDIO_DIR=$PWD/mkstudio xvfb-run -a wish8.6 tests/studio_integration.tcl
