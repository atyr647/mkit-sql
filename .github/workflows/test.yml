name: test

# mkit-sql targets the same Tcl runtimes MK Studio is built and tested on (see README, "Runtimes"):
#   tclkit 8.6.3   the primary runtime - everything runs here, against the Mk4tcl built into it
#   tclkit 8.5.17  the compatibility runtime for classic tclkits
# The kits are downloaded by tests/fetch-tclkit.sh, which checks each against its published SHA1.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      T86: tclkit/tclkit-8.6.3
      T85: tclkit/tclkit-8.5.17
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y python3 xvfb
      - name: Fetch the tclkit runtimes (SHA1-verified)
        run: tests/fetch-tclkit.sh

      - name: Lint (ASCII, no shadowed commands, nothing newer than the target runtimes)
        run: $T86 tests/lint.tcl

      # ---- primary runtime: tclkit 8.6.3 with its built-in (real) Mk4tcl
      - name: Engine tests, tclkit 8.6.3, pure-Tcl Mk4tcl stand-in
        run: $T86 tests/run.tcl
      - name: Engine tests, tclkit 8.6.3, REAL Metakit
        run: MKIT_MK4TCL=builtin $T86 tests/run.tcl
      - name: Metakit-specific tests, tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/real_metakit.tcl
      - name: Documentation examples, tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/doc_examples.tcl
      - name: package require, tclkit 8.6.3
        run: $T86 tests/pkg_check.tcl
      - name: Differential tests against SQLite (engine runs on tclkit 8.6.3, real Metakit)
        env:
          MKIT_TCLSH: tclkit/tclkit-8.6.3
          MKIT_MK4TCL: builtin
        run: |
          for seed in 1 2 3; do python3 tests/differential/diff.py --n 3000 --seed $seed; done
          for seed in 4 5; do python3 tests/differential/diff.py --kind window --n 1500 --seed $seed; done
          python3 tests/differential/diff.py --file tests/differential/recursive.sql
      - name: Scale test, tclkit 8.6.3, REAL Metakit
        run: MKIT_MK4TCL=builtin $T86 tests/scale.tcl 100000

      # ---- compatibility runtime: tclkit 8.5.17
      - name: Engine tests, tclkit 8.5.17, REAL Metakit
        run: MKIT_MK4TCL=builtin $T85 tests/run.tcl
      - name: Engine tests, tclkit 8.5.17, pure-Tcl Mk4tcl stand-in
        run: $T85 tests/run.tcl
      - name: Metakit-specific tests, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/real_metakit.tcl
      - name: Documentation examples, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/doc_examples.tcl
      - name: Differential tests, tclkit 8.5.17
        env:
          MKIT_TCLSH: tclkit/tclkit-8.5.17
          MKIT_MK4TCL: builtin
        run: |
          python3 tests/differential/diff.py --n 3000 --seed 6
          python3 tests/differential/diff.py --kind window --n 1500 --seed 7

  # An extra check against a Mk4tcl compiled from the current Metakit sources (system Tcl 8.6).
  # Not the target runtime, so it is informational only.
  metakit-from-source:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcl8.6-dev cmake g++ python3
      - name: Build the real Metakit + Mk4tcl
        run: tests/build_mk4tcl.sh "$RUNNER_TEMP/mk4build"
      - name: Engine and Metakit-specific tests
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/mk4build/build/src"
          export MKIT_MK4TCL="$RUNNER_TEMP/mk4build/build/tcl/libMk4tcl.so"
          tclsh8.6 tests/run.tcl
          tclsh8.6 tests/real_metakit.tcl

  # Reads (never writes) the mkstudio repository; kept separate so the engine job never depends on it.
  mkstudio:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      T86: tclkit/tclkit-8.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atyr647/mkstudio
          ref: ${{ vars.MKSTUDIO_REF || 'main' }}
          path: mkstudio
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fetch the tclkit runtimes (SHA1-verified)
        run: tests/fetch-tclkit.sh
      - name: mkstudio's own engine contract, tclkit 8.6.3, real Metakit
        run: MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio $T86 tests/studio_contract.tcl
      - name: The real MK Studio UI with mkit-sql behind it, tclkit 8.6.3, real Metakit
        run: MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio xvfb-run -a $T86 tests/studio_integration.tcl
      - name: The installer and patch apply to a fresh mkstudio checkout
        run: |
          cp -r mkstudio mkstudio-fresh
          integration/install-into-mkstudio.sh "$PWD/mkstudio-fresh"
