name: test

# mkit-sql targets the same Tcl runtimes MK Studio is built and tested on (see README, "Runtimes"):
#   tclkit 8.6.3   the primary runtime - everything runs here, against the Mk4tcl built into it
#   tclkit 8.5.17  the compatibility runtime for classic tclkits
# The kits are downloaded by tests/fetch-tclkit.sh, which checks each against its published SHA1.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      T86: tclkit/tclkit-8.6.3
      T85: tclkit/tclkit-8.5.17
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y python3 xvfb strace
      - name: Fetch the tclkit runtimes (SHA1-verified)
        run: tests/fetch-tclkit.sh

      - name: Lint (ASCII, no shadowed commands, nothing newer than the target runtimes, inventory of code boundaries)
        run: $T86 tests/lint.tcl

      # ---- primary runtime: tclkit 8.6.3 with its built-in (real) Mk4tcl
      - name: Engine tests, tclkit 8.6.3, REAL Metakit
        run: MKIT_MK4TCL=builtin $T86 tests/run.tcl
      - name: Metakit-specific tests, tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/real_metakit.tcl
      - name: Documentation examples, tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/doc_examples.tcl
      - name: Code-injection and quoting test, tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/injection.tcl
      - name: Fuzzer (malformed SQL must fail cleanly), tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/fuzz.tcl 40000 1
      - name: A Metakit file we did not create (a tclkit boot database), tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/realworld.tcl tclkit/tclkit-8.5.17
      - name: package require (standalone, and next to MK Studio's store), tclkit 8.6.3
        run: for m in standalone studio; do $T86 tests/pkg_check.tcl $m; done
      - name: package require (standalone, and next to MK Studio's store), tclkit 8.5.17
        run: for m in standalone studio; do $T85 tests/pkg_check.tcl $m; done
      - name: Engine tests on the pure-Tcl stand-in (system Tcl)
        run: sudo apt-get install -y tcl8.6 && tclsh8.6 tests/run.tcl
      - name: Tcl 8.5 / 8.6.3 list bug - identical results on the old runtimes and on a healthy Tcl, every budget, both storage layers
        run: |
          for seed in 1 2 3; do
            LB_SEED=$seed sh tests/listbug.sh tclsh8.6 $T86 $T85
            MKIT_BACKEND=studio LB_SEED=$seed sh tests/listbug.sh tclsh8.6 $T86
          done
      - name: Findings of the independent reviews (regression tests), tclkit 8.6.3 and 8.5.17, both storage layers, tiny budget
        run: |
          for k in $T86 $T85; do
            for b in standalone studio; do MKIT_BACKEND=$b MKIT_MK4TCL=builtin $k tests/review_regress.tcl; done
            MKIT_MEMBYTES=20000 MKIT_CHUNK=3 MKIT_MK4TCL=builtin $k tests/review_regress.tcl
          done
      - name: Differential tests against SQLite (engine runs on tclkit 8.6.3, real Metakit)
        env:
          MKIT_TCLSH: tclkit/tclkit-8.6.3
          MKIT_MK4TCL: builtin
        run: |
          for seed in 1 2 3; do python3 tests/differential/diff.py --n 3000 --seed $seed; done
          for seed in 4 5; do python3 tests/differential/diff.py --kind window --n 1500 --seed $seed; done
          python3 tests/differential/diff.py --file tests/differential/recursive.sql
      - name: Scale test, tclkit 8.6.3, REAL Metakit
        run: MKIT_MK4TCL=builtin $T86 tests/scale.tcl 100000
      - name: Both storage layers (standalone db.tcl, and MK Studio's ::store through db_studio.tcl), tclkit 8.6.3
        run: |
          for b in standalone studio; do
            for t in run real_metakit doc_examples injection nullforge codegen_audit; do
              echo "== $b / $t"; MKIT_BACKEND=$b MKIT_MK4TCL=builtin $T86 tests/$t.tcl
            done
          done
      - name: Tiny memory budgets force every operator to spill, tclkit 8.6.3
        run: |
          for cfg in "1 1" "50 3" "400 7" "2000 11"; do
            set -- $cfg
            echo "== memBytes $1 chunk $2"
            MKIT_MEMBYTES=$1 MKIT_CHUNK=$2 MKIT_MK4TCL=builtin $T86 tests/run.tcl
            MKIT_MEMBYTES=$1 MKIT_CHUNK=$2 MKIT_MK4TCL=builtin $T86 tests/injection.tcl
          done
          MKIT_MEMBYTES=50 MKIT_CHUNK=3 MKIT_TCLSH=$T86 MKIT_MK4TCL=builtin python3 tests/differential/diff.py --n 2000 --seed 11
      - name: Failure injection, spill round-trips, robustness (both storage layers), tclkit 8.6.3
        run: |
          for b in standalone studio; do
            for t in dropview spillroundtrip robustness; do
              echo "== $b / $t"; MKIT_BACKEND=$b MKIT_MK4TCL=builtin $T86 tests/$t.tcl
            done
          done
      - name: Oracle tests - numeric edges, strings/LIKE, dates (SQLite or an independent Python model), tclkit 8.6.3
        env:
          MKIT_TCLSH: tclkit/tclkit-8.6.3
          MKIT_MK4TCL: builtin
        run: |
          python3 tests/differential/numeric.py
          MKIT_MEMBYTES=1 MKIT_CHUNK=1 python3 tests/differential/numeric.py
          for seed in 1 2 3; do python3 tests/differential/strings.py --n 3000 --seed $seed; python3 tests/differential/dates.py --n 4000 --seed $seed; done
      - name: Stateful DML differential against SQLite (inserts, updates, deletes, CTAS, rollback), tclkit 8.6.3
        env:
          MKIT_TCLSH: tclkit/tclkit-8.6.3
          MKIT_MK4TCL: builtin
        run: |
          python3 tests/differential/dml.py --seqs 40 --steps 40 --seed 1
          MKIT_BULKMIN=1 MKIT_MEMBYTES=50 MKIT_CHUNK=3 python3 tests/differential/dml.py --seqs 30 --steps 40 --seed 2
      - name: Pushdown, temporary files, locking (real processes; MK Studio interoperability), tclkit 8.6.3
        run: |
          for b in standalone studio; do MKIT_BACKEND=$b MKIT_MK4TCL=builtin $T86 tests/pushdown.tcl 400 1; done
          MKIT_MK4TCL=builtin $T86 tests/tempsec.tcl
          MKIT_MK4TCL=builtin $T86 tests/locking.tcl
          MKIT_PUSHMIN=0 MKIT_MK4TCL=builtin $T86 tests/run.tcl
          MKIT_PUSHDOWN=0 MKIT_MK4TCL=builtin $T86 tests/run.tcl
          MKIT_TCLSH=$T86 MKIT_MK4TCL=builtin MKIT_PUSHMIN=0 python3 tests/differential/diff.py --n 3000 --seed 81
      - name: Power loss - 406 synthesised crash states and 18 real commits killed after every Nth write (strace), both kits
        run: |
          for k in $T86 $T85; do MKIT_MK4TCL=builtin $k tests/power_loss.tcl; done
          MKIT_BACKEND=studio MKIT_MK4TCL=builtin $T86 tests/studio_repair.tcl
      - name: Lock under crashes - kill at every step, a deterministic vanished-lock race, 60 races for a stale lock, chaos (both kits)
        run: |
          for k in $T86 $T85; do LOCK_ROUNDS=60 MKIT_MK4TCL=builtin $k tests/lock_crash.tcl; done
      - name: Big deletes/updates rebuild the table - same result as row by row, tclkit 8.6.3 and 8.5.17
        run: |
          MKIT_MK4TCL=builtin $T86 tests/bulkwrite.tcl 150 4
          MKIT_MK4TCL=builtin $T85 tests/bulkwrite.tcl 80 5
          MKIT_BULKMIN=1 MKIT_MK4TCL=builtin $T86 tests/run.tcl
      - name: Soak - tens of thousands of mixed statements in one process, nothing accumulates, tclkit 8.6.3
        run: MKIT_MK4TCL=builtin $T86 tests/soak.tcl 60 1
      - name: Memory stays flat on a big table (streaming, spilling), tclkit 8.6.3, REAL Metakit
        run: MKIT_MK4TCL=builtin $T86 tests/scale_memory.tcl 200000 4194304

      # ---- compatibility runtime: tclkit 8.5.17
      - name: Engine tests, tclkit 8.5.17, REAL Metakit
        run: MKIT_MK4TCL=builtin $T85 tests/run.tcl
      - name: Metakit-specific tests, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/real_metakit.tcl
      - name: Documentation examples, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/doc_examples.tcl
      - name: Code-injection and quoting test, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/injection.tcl
      - name: Fuzzer, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/fuzz.tcl 40000 1
      - name: Pushdown, temporary files, locking, tclkit 8.5.17
        run: |
          MKIT_MK4TCL=builtin $T85 tests/pushdown.tcl 300 2
          MKIT_MK4TCL=builtin $T85 tests/tempsec.tcl
          MKIT_MK4TCL=builtin $T85 tests/locking.tcl
      - name: Failure injection, spill round-trips, robustness, tclkit 8.5.17
        run: |
          for t in dropview spillroundtrip robustness; do MKIT_MK4TCL=builtin $T85 tests/$t.tcl; done
      - name: DML differential, tclkit 8.5.17
        env:
          MKIT_TCLSH: tclkit/tclkit-8.5.17
          MKIT_MK4TCL: builtin
        run: MKIT_BULKMIN=1 python3 tests/differential/dml.py --seqs 30 --steps 40 --seed 3
      - name: Both storage layers, tclkit 8.5.17
        run: |
          for b in standalone studio; do
            for t in run real_metakit nullforge codegen_audit; do
              echo "== $b / $t"; MKIT_BACKEND=$b MKIT_MK4TCL=builtin $T85 tests/$t.tcl
            done
          done
      - name: Tiny memory budgets, tclkit 8.5.17
        run: |
          for cfg in "1 1" "400 7"; do
            set -- $cfg
            MKIT_MEMBYTES=$1 MKIT_CHUNK=$2 MKIT_MK4TCL=builtin $T85 tests/run.tcl
          done
      - name: A Metakit file we did not create, tclkit 8.5.17
        run: MKIT_MK4TCL=builtin $T85 tests/realworld.tcl tclkit/tclkit-8.6.3
      - name: Differential tests, tclkit 8.5.17
        env:
          MKIT_TCLSH: tclkit/tclkit-8.5.17
          MKIT_MK4TCL: builtin
        run: |
          python3 tests/differential/diff.py --n 3000 --seed 6
          python3 tests/differential/diff.py --kind window --n 1500 --seed 7

  # An extra check against a Mk4tcl compiled from the current Metakit sources (system Tcl 8.6).
  metakit-from-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcl8.6-dev cmake g++ python3
      - name: Build the real Metakit + Mk4tcl
        run: tests/build_mk4tcl.sh "$RUNNER_TEMP/mk4build"
      - name: Engine and Metakit-specific tests
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/mk4build/build/src"
          export MKIT_MK4TCL="$RUNNER_TEMP/mk4build/build/tcl/libMk4tcl.so"
          tclsh8.6 tests/run.tcl
          tclsh8.6 tests/real_metakit.tcl
          tclsh8.6 tests/dropview.tcl
          tclsh8.6 tests/robustness.tcl
          tclsh8.6 tests/bulkwrite.tcl

  # Reads (never writes) the mkstudio repository.  If that repository cannot be read by this workflow (it is
  # private: add a read-only token as the secret MKSTUDIO_READ_TOKEN) the steps are skipped and a visible
  # warning is printed - a skipped job is never reported as a pass.  If it can be read, a failure is a failure.
  mkstudio:
    runs-on: ubuntu-latest
    env:
      T86: tclkit/tclkit-8.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Check out MK Studio (read-only)
        id: ms
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: atyr647/mkstudio
          ref: ${{ vars.MKSTUDIO_REF }}               # empty = the repository's default branch
          path: mkstudio
          token: ${{ secrets.MKSTUDIO_READ_TOKEN || github.token }}
      - name: MK Studio could not be checked out - interoperability tests SKIPPED
        if: steps.ms.outcome != 'success'
        run: echo "::warning title=mkstudio job skipped::the atyr647/mkstudio repository is not readable by this workflow. Add a read-only token as the secret MKSTUDIO_READ_TOKEN to run the MK Studio contract, UI and locking-interoperability tests."
      - name: Install tools
        if: steps.ms.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fetch the tclkit runtimes (SHA1-verified)
        if: steps.ms.outcome == 'success'
        run: tests/fetch-tclkit.sh
      - name: mkstudio's own engine contract, tclkit 8.6.3, real Metakit
        if: steps.ms.outcome == 'success'
        run: MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio $T86 tests/studio_contract.tcl
      - name: The real MK Studio UI with mkit-sql behind it, tclkit 8.6.3, real Metakit
        if: steps.ms.outcome == 'success'
        run: MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio xvfb-run -a $T86 tests/studio_integration.tcl
      - name: Locking interoperates with MK Studio's own store.tcl (separate processes, both directions)
        if: steps.ms.outcome == 'success'
        run: MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio $T86 tests/locking.tcl
      - name: MK Studio's own lock-protocol test (mixed races, crash points) against this checkout's mkit-sql
        if: steps.ms.outcome == 'success'
        working-directory: mkstudio
        run: MKITSQL_DIR="$GITHUB_WORKSPACE" REAL_MK=1 MKS_RACE_ROUNDS=10 MKIT_MK4TCL=builtin "$GITHUB_WORKSPACE/tclkit/tclkit-8.6.3" tests/run.tcl tests/test_lock_protocol.tcl
      - name: The installer and patch apply to a fresh mkstudio checkout
        if: steps.ms.outcome == 'success'
        run: |
          cp -r mkstudio mkstudio-fresh
          integration/install-into-mkstudio.sh "$PWD/mkstudio-fresh"
      - name: The patched MK Studio reads rows intact on the Tcl 8.5 / 8.6.3 list bug (its own contract and lint still pass)
        if: steps.ms.outcome == 'success'
        run: |
          for k in tclkit/tclkit-8.6.3 tclkit/tclkit-8.5.17; do
            MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio-fresh $k tests/studio_listbug.tcl
            MKIT_MK4TCL=builtin MKSTUDIO_DIR=$PWD/mkstudio-fresh $k tests/studio_contract.tcl
          done
          (cd mkstudio-fresh && MKIT_MK4TCL=builtin ../tclkit/tclkit-8.6.3 tests/lint.tcl)

  # Tcl 9: Mk4tcl has no Tcl 9 build, so the engine runs on the pure-Tcl stand-in; the point is that nothing in the engine
  # depends on Tcl 8 behaviour (octal file modes, list and string details) - the whole suite that does not need real Metakit.
  tcl9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Tcl 9.0 from source
        run: |
          sudo apt-get update && sudo apt-get install -y python3 zlib1g-dev
          git clone --depth 1 --branch core-9-0-1 https://github.com/tcltk/tcl "$RUNNER_TEMP/tcl9src"
          cd "$RUNNER_TEMP/tcl9src/unix" && ./configure --prefix="$RUNNER_TEMP/tcl9" --disable-shared >/dev/null && make -j4 >/dev/null && make install >/dev/null
          echo "T9=$RUNNER_TEMP/tcl9/bin/tclsh9.0" >> "$GITHUB_ENV"
      - name: Lint, engine suite on both storage layers
        run: |
          "$T9" tests/lint.tcl
          for b in standalone studio; do MKIT_BACKEND=$b "$T9" tests/run.tcl; done
      - name: Injection, NULL forgery, code generation, spill, robustness, review regressions, drop view, pushdown, bulk writes
        run: for t in doc_examples injection nullforge codegen_audit dropview spillroundtrip robustness review_regress pushdown bulkwrite; do echo "== $t"; "$T9" tests/$t.tcl; done
      - name: Temp files and locking (file modes are decimal on purpose - Tcl 9 reads 0600 as decimal), lock crash, soak, fuzzer
        run: |
          "$T9" tests/tempsec.tcl
          "$T9" tests/locking.tcl
          LOCK_ROUNDS=20 "$T9" tests/lock_crash.tcl
          "$T9" tests/soak.tcl 30 1
          "$T9" tests/fuzz.tcl 20000 1
      - name: Differentials on Tcl 9 (SQLite, numeric, strings, dates, DML)
        env:
          MKIT_TCLSH: ${{ env.T9 }}
        run: |
          python3 tests/differential/diff.py --n 2000 --seed 1
          python3 tests/differential/diff.py --kind window --n 1000 --seed 2
          python3 tests/differential/numeric.py
          python3 tests/differential/strings.py --n 2000 --seed 1
          python3 tests/differential/dates.py --n 2500 --seed 1
          python3 tests/differential/dml.py --seqs 20 --steps 30 --seed 1

  # Other platforms.  The pure-Tcl stand-in needs only a Tcl 8.5+ shell; the real-Metakit run builds Mk4tcl from
  # source where it can.  Informational until each one is green, then it becomes required.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]      # macOS runs Tcl 8.6, Windows Tcl 9 (the engine supports 8.5 to 9; Mk4tcl exists only for 8.x, so these run on the pure-Tcl stand-in)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      TMPDIR: ${{ runner.temp }}          # the tests put scratch files in $TMPDIR (default /tmp, which Windows does not have)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tcl (macOS)
        if: runner.os == 'macOS'
        run: brew install tcl-tk@8 && echo "TCLSH=$(brew --prefix tcl-tk@8)/bin/tclsh8.6" >> "$GITHUB_ENV"
      - name: Tcl (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install magicsplat-tcl-tk --no-progress -y || true
          # find the interpreter wherever the installer put it, and show what was found (so a failure can be diagnosed from the log)
          FOUND=$(find /c/Tcl /c/Program\ Files/Tcl* /c/Program\ Files/Magicsplat* /c/ProgramData/chocolatey/lib /c/tools -iname 'tclsh*.exe' 2>/dev/null || true)
          echo "found: $FOUND"
          T=$(echo "$FOUND" | grep -iv 'tclsh.*s\.exe' | head -1)
          [ -n "$T" ] || T=$(echo "$FOUND" | head -1)
          echo "TCLSH=$T" >> "$GITHUB_ENV"
      - name: Which Tcl
        run: |
          echo "using: $TCLSH"; "$TCLSH" <<< 'puts [info patchlevel]; puts $tcl_platform(os)'
      - name: Lint
        run: '"$TCLSH" tests/lint.tcl'
      - name: Engine tests on the stand-in, both storage layers
        run: |
          "$TCLSH" tests/run.tcl
          MKIT_BACKEND=standalone "$TCLSH" tests/run.tcl
      - name: Spill, robustness, injection, nullforge
        run: |
          "$TCLSH" tests/spillroundtrip.tcl
          "$TCLSH" tests/robustness.tcl
          "$TCLSH" tests/injection.tcl
          "$TCLSH" tests/nullforge.tcl
          "$TCLSH" tests/review_regress.tcl
      - name: Temp files and locking (Unix semantics; skipped on Windows)
        run: |
          "$TCLSH" tests/tempsec.tcl
          "$TCLSH" tests/locking.tcl
